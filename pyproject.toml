[project]
name = "financial-agent"
version = "0.1.0"
description = "Financial market research workflows and evidence-based evaluation"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]
longport = ["longbridge==4.5.0"]

[project.scripts]
financial-agent = "financial_agent.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
"financial_agent.sources" = ["fixtures/*.json"]
