name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
        dependencies: [current]
        include:
          - python-version: "3.12"
            dependencies: compat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - if: matrix.dependencies == 'compat'
        run: python -m pip install "typer==0.12.3" "click==8.1.7"
      - run: python -m pytest -q
      - run: financial-agent research demo
      - run: financial-agent evaluate research
      - run: financial-agent screen smoke
